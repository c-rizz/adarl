[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adarl"
version = "0.0.1"
authors = [
  { name="Carlo Rizzardo", email="cr.git.mail@gmail.com" },
]
description = "Learn-Real gym"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
adarl = "adarl:launcher"

# [tool.setuptools]
# # ...
# # By default, include-package-data is true in pyproject.toml, so you do
# # NOT have to specify this line.
# include-package-data = true
# 
# [tool.setuptools.packages.find]
# where = ["src","src/adarl/models","src/adarl/assets"]

[tool.setuptools.package-data]
"adarl.models" = ["*.urdf", "*.xacro"]
"adarl.assets.audio" = ["*.ogg"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# adapter_compliance.py is a shared helper library, not a test module
addopts = "--strict-markers"
markers = [
    "gpu: needs a CUDA/JAX GPU device",
    "slow: slow to run (builds a simulator and/or runs many steps)",
    "mujoco: exercises the MuJoCo (CPU) backend",
    "mjx: exercises the MJX (JAX/WARP, GPU) backend",
    "genesis: exercises the Genesis backend",
    "integration: end-to-end across multiple components",
]